name: Release

# Every push to main deploys the demo. If package.json contains an unpublished
# version, that same push also publishes it to npm with provenance.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Also publish to npm (otherwise only the demo is deployed)
        type: boolean
        default: false

concurrency:
  group: release
  # A later tag/dispatch represents the newer site.  Without cancellation an
  # older queued release can finish last and overwrite the Pages deployment.
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Skip if this version is already on npm
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "swipe-pagination@$version" version >/dev/null 2>&1; then
            echo "v$version is already published"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npm run build
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public

  demo:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
      - id: deploy
        uses: actions/deploy-pages@v4
